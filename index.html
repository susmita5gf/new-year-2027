<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বাগতম ২০২৭</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Poppins:wght@600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="bg"></canvas>

    <main class="wrap">
        <div class="ring"></div>

        <p class="bidai">বিদায় 2026</p>

        <h1 class="year">
            <span>2</span><span>0</span><span>2</span><span>7</span>
        </h1>

        <p class="typed" id="typed"></p>

        <div class="countdown" id="countdown">
            <div class="box"><b id="d">00</b><small>দিন</small></div>
            <div class="box"><b id="h">00</b><small>ঘণ্টা</small></div>
            <div class="box"><b id="m">00</b><small>মিনিট</small></div>
            <div class="box"><b id="s">00</b><small>সেকেন্ড</small></div>
        </div>

        <button id="btn">শুভ নববর্ষ 🎆</button>
    </main>

    <script src="script.js"></script>
</body>

</html>
